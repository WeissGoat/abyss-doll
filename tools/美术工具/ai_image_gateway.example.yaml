# Project P3 AI 图片网关配置模板。
# 复制到 tools/ai-image-gateway/config.local.yaml，并保持该文件不提交。

default_provider:
  generate: openai_images
  image_to_image: gemini_chat_image
  inpaint: novelai
  upscale: mock

providers:
  mock:
    enabled: true
    settings:
      bg_color: "#222533"
      text_color: "#e7d28a"

  openai_images:
    enabled: true
    auth:
      api_key: ${OPENAI_IMAGE_API_KEY}
    settings:
      base_url: ${OPENAI_IMAGE_BASE_URL}
      endpoint: /images/generations
      edit_endpoint: /images/edits
      model: gpt-image-2
      response_format: b64_json
      size: 1024x1024
      quality: high
      output_format: png
      timeout: 360
      retry: 1

  gemini_chat_image:
    enabled: true
    auth:
      api_key: ${GEMINI_IMAGE_API_KEY}
    settings:
      base_url: ${GEMINI_IMAGE_BASE_URL}
      endpoint: /chat/completions
      model: gemini-3.1-flash-image
      temperature: 0.2
      timeout: 180
      retry: 1

  novelai:
    enabled: true
    auth:
      access_token: ${NAI_ACCESS_TOKEN}
      # client_py_path: F:\my_project\new\tags_machine\novelai\client.py
    settings:
      model: nai-diffusion-4-5-full
      sampler: k_euler
      scheduler: native
      steps: 28
      cfg: 5.0
      cfg_rescale: 0.0
      uncond_scale: 1.0
      uc_preset: 3
      smea: none
      variety: false
      decrisper: false
      limit_opus_free: true
      timeout: 120
      retry: 3

logging:
  level: INFO
